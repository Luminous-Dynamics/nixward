[package]
name = "nixward"
version = "0.1.0"
edition = "2024"
authors = ["Luminous Dynamics <tristan.stoltz@evolvingresonantcocreationism.com>"]
description = "Symthaea NixOS: A conscious mind for NixOS system management via HDC and active inference"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Luminous-Dynamics/nixward"
readme = "README.md"

[lib]
name = "nixward"
path = "src/lib.rs"

[[bin]]
name = "nixward"
path = "src/bin/nixward.rs"
required-features = ["cli"]

[[bin]]
name = "nixward-tui"
path = "src/bin/nixward_tui.rs"
required-features = ["tui"]

[[bin]]
name = "nixward-daemon"
path = "src/bin/nixward_daemon.rs"
required-features = ["daemon"]

[[bin]]
name = "nixward-release-sign"
path = "src/bin/nixward_release_sign.rs"

[[bin]]
name = "nixward-owner-key"
path = "src/bin/nixward_owner_key.rs"

[dependencies]
# Pin the cognitive core to a content-addressed upstream revision. This is the
# only cross-repository source dependency; all other dependencies are resolved
# from crates.io so this repository remains independently buildable.
symthaea-core = {
  git = "https://github.com/Luminous-Dynamics/symthaea.git",
  rev = "77b872fd116c7b6f44fedd82bb8c6100240caa73",
  package = "symthaea-core",
}

# Native-only (C FFI, async)
tree-sitter = { version = "0.24", optional = true }
tree-sitter-nix = { version = "0.3", optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }

# WASM-safe
blake3 = "1.5"
sha2 = "0.10"
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
strsim = "0.11"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
lru = "0.16"
dashmap = "5.5"
nix = { version = "0.27", optional = true, features = ["fs"] }
openssl = { version = "0.10.81", optional = true }
x509-parser = { version = "0.18.1", optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
rnix = "0.11"
ed25519-dalek = { version = "=2.1.0", default-features = false, features = ["alloc", "rand_core"] }

# CLI (optional)
clap = { version = "4.4", features = ["derive"], optional = true }
clap_complete = { version = "4.4", optional = true }

# TUI (optional)
crossterm = { version = "0.27", optional = true }
ratatui = { version = "0.30", optional = true }

# Systemd (optional)
zbus = { version = "4.0", optional = true }
libsystemd = { version = "0.7", optional = true }

# Observability (optional)
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", default-features = false, optional = true }
hyper = { version = "1.0", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "hdc_benchmarks"
harness = false

[features]
default = ["native"]
native = ["nix", "rusqlite", "tree-sitter", "tree-sitter-nix", "tokio", "openssl", "x509-parser"]
cli = ["clap", "clap_complete", "native"]
tui = ["crossterm", "ratatui", "cli"]
daemon = ["tokio/full", "native"]
systemd = ["zbus", "libsystemd", "native"]
observability = ["tracing-subscriber", "metrics", "metrics-exporter-prometheus", "hyper", "hyper-util", "http-body-util", "daemon"]
full = ["cli", "tui", "daemon", "systemd"]
