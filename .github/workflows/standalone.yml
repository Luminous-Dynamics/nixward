name: standalone

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Generate lockfile
        shell: bash
        run: cargo generate-lockfile

      - name: Persist generated lockfile
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if ! git diff --cached --quiet -- Cargo.lock; then
            git commit -m "build: add standalone Cargo lockfile"
            git push
          fi

      - name: Check default feature set
        run: cargo check --locked --all-targets

      - name: Check full native feature set
        run: cargo check --locked --all-targets --features full

      - name: Run library tests
        run: cargo test --locked --lib

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
