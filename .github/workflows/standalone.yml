name: standalone

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-lockfile:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Generate lockfile
        shell: bash
        run: cargo generate-lockfile

      - name: Persist generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: add standalone Cargo lockfile"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"${GITHUB_REF_NAME}"

  validate:
    needs: bootstrap-lockfile
    # A skipped bootstrap is expected for pull_request and main pushes. GitHub
    # otherwise skips dependent jobs too; always() preserves the fail-closed
    # qualification decision instead of silently producing a skipped check.
    if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || needs.bootstrap-lockfile.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Refresh hardening branch after lock bootstrap
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustc --version
          cargo --version

      - name: Verify standalone filesystem boundary
        run: python3 scripts/verify-standalone-boundary.py

      - name: Require repository lockfile
        shell: bash
        run: test -f Cargo.lock

      - name: Check default feature set
        run: cargo check --locked --all-targets

      - name: Check full native feature set
        run: cargo check --locked --all-targets --features full

      - name: Run library tests
        run: cargo test --locked --lib

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Emit qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          validated_commit="$(git rev-parse HEAD)"
          trigger_commit="${GITHUB_SHA}"
          cat > qualification-receipt.json <<JSON
          {
            "schema": "luminous-nixward-standalone-qualification-v1",
            "validated_commit": "$validated_commit",
            "trigger_commit": "$trigger_commit",
            "rustc": "$(rustc --version)",
            "cargo": "$(cargo --version)",
            "cargo_lock_sha256": "$(sha256sum Cargo.lock | cut -d' ' -f1)",
            "cargo_toml_sha256": "$(sha256sum Cargo.toml | cut -d' ' -f1)",
            "flake_sha256": "$(sha256sum flake.nix | cut -d' ' -f1)",
            "boundary": "standalone-filesystem-boundary-pass"
          }
          JSON

      - name: Upload qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nixward-standalone-qualification-${{ github.sha }}
          path: qualification-receipt.json
          if-no-files-found: error
          retention-days: 30

  provenance:
    name: Signed Nixward provenance
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main as of 2026-09-09
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Verify standalone boundary
        run: python3 scripts/verify-standalone-boundary.py

      - name: Require committed lockfile
        run: test -f Cargo.lock

      - name: Build exact Nixward CLI
        run: nix build .#nixward --no-update-lock-file --no-write-lock-file

      - name: Generate signed SLSA provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/result/bin/nixward
          show-summary: true
