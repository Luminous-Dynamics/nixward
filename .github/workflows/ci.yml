name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cargo:
    name: Cargo qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Standalone contract
        run: nix develop -c bash tests/standalone-contract.sh

      - name: Format
        run: nix develop -c cargo fmt --all -- --check

      - name: Check
        run: nix develop -c cargo check --all-targets --features full

      - name: Unit tests
        run: nix develop -c cargo test --features tui --lib

      - name: CLI integration
        run: nix develop -c cargo test --features cli --test cli_integration

      - name: Host-boundary property tests
        run: nix develop -c cargo test --test proptest_hdc

  nix:
    name: Nix qualification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Standalone contract
        run: nix develop -c bash tests/standalone-contract.sh

      - name: Format Nix
        run: nix fmt -- --check

      - name: Evaluate flake
        run: nix flake check

      - name: Build CLI package
        run: nix build .#nixward --no-link
