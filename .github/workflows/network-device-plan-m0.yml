name: Network device planner M0

on:
  pull_request:
    branches: [main]
    paths:
      - "src/network_device_plan.rs"
      - "tests/network-device-plan-harness/**"
      - ".github/workflows/network-device-plan-m0.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-device-plan-m0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-planner:
    name: Format and unit-test pure planner (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 1.96.0 matches the monorepo's pinned compiler; 1.99.0 checks current stable.
        toolchain: ["1.96.0", "1.99.0"]
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt

      - name: Record compiler identity
        run: |
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --manifest-path tests/network-device-plan-harness/Cargo.toml -- --check

      - name: Run exact-source unit tests with locked dependencies
        run: cargo test --locked --manifest-path tests/network-device-plan-harness/Cargo.toml --all-targets --verbose
