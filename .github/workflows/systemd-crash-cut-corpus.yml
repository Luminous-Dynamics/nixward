name: systemd crash-cut corpus guard

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "src/action/systemd_job_evidence.rs"
      - "docs/fixtures/systemd-transaction-crash-cuts-v1.json"
      - "docs/fixtures/systemd-transaction-crash-cuts-v1.schema.json"
      - "docs/fixtures/systemd-transaction-crash-cut-vm-campaign-v1.schema.json"
      - "nix/tests/systemd-transaction-crash-cut-vm.nix"
      - ".github/workflows/systemd-crash-cut-corpus.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - "src/action/systemd_job_evidence.rs"
      - "docs/fixtures/systemd-transaction-crash-cuts-v1.json"
      - "docs/fixtures/systemd-transaction-crash-cuts-v1.schema.json"
      - "docs/fixtures/systemd-transaction-crash-cut-vm-campaign-v1.schema.json"
      - "nix/tests/systemd-transaction-crash-cut-vm.nix"
      - ".github/workflows/systemd-crash-cut-corpus.yml"

permissions:
  contents: read

concurrency:
  group: systemd-crash-cut-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  corpus-guard:
    name: Nix and Rust crash-cut corpus guards
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install pinned Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Parse VM campaign receipt schema
        run: python3 -m json.tool docs/fixtures/systemd-transaction-crash-cut-vm-campaign-v1.schema.json > /dev/null
      - name: Evaluate crash-cut corpus flake check
        run: nix build .#checks.x86_64-linux.systemd-transaction-crash-cut-corpus --no-link -L
      - name: Build and execute disposable NixOS/QEMU crash-cut campaign
        run: |
          NIXWARD_SOURCE_REVISION="${GITHUB_SHA}" nix build --impure .#checks.x86_64-linux.systemd-transaction-crash-cut-vm --out-link "$RUNNER_TEMP/nixward-crash-cut-vm-result" -L
          cp -aL "$RUNNER_TEMP/nixward-crash-cut-vm-result" "$RUNNER_TEMP/nixward-crash-cut-vm-campaign"
      - name: Publish disposable VM campaign evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nixward-crash-cut-vm-${{ github.sha }}
          path: ${{ runner.temp }}/nixward-crash-cut-vm-campaign
          if-no-files-found: error
          retention-days: 30
      - name: Install pinned Rust toolchain for isolated production-source regression
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup override set 1.96.0
      - name: Regenerate and report canonical isolated harness lockfile
        run: |
          cargo generate-lockfile --manifest-path research/systemd-crash-cut-check/Cargo.toml
          sha256sum research/systemd-crash-cut-check/Cargo.lock
          cat research/systemd-crash-cut-check/Cargo.lock
          git diff -- research/systemd-crash-cut-check/Cargo.lock
      - name: Test exact production systemd evidence module in isolation
        run: cargo test --manifest-path research/systemd-crash-cut-check/Cargo.toml --locked
